<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shrimpt — Settings</title>
    <link rel="stylesheet" href="../popup/popup.css" />
    <style>
      html {
        width: auto;
        height: auto;
        max-height: none;
        overflow: auto;
      }

      body {
        width: auto;
        max-width: 480px;
        height: auto;
        max-height: none;
        margin: 24px auto;
        padding: 0 16px 32px;
        overflow: visible;
      }

      .options-shell h1 {
        margin: 0 0 20px;
        font-size: 20px;
        font-weight: 700;
        color: var(--bw-text);
      }

      .options-card {
        padding: 16px;
        border: 1px solid var(--bw-border);
        border-radius: var(--radius);
        margin-bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
      }

      .options-card .label {
        margin-bottom: 0;
      }

      .options-card input[type="number"],
      .options-card select {
        width: 100%;
        max-width: 280px;
      }

      .options-card .check-row {
        margin: 0;
      }

      .options-popup-link {
        align-self: flex-start;
        margin: 0;
        padding: 0;
      }

      .pin-gate {
        border: 1px solid var(--bw-border);
        padding: 20px;
        border-radius: var(--radius);
        margin-bottom: 24px;
        background: transparent;
      }

      .pin-gate[hidden],
      #main-options[hidden] {
        display: none !important;
      }

      #pin-create-fields[hidden],
      #pin-unlock-fields[hidden] {
        display: none !important;
      }

      #pin-gate-title {
        margin: 0 0 8px;
        color: var(--bw-text);
      }

      #pin-gate-desc {
        margin: 0 0 12px;
        color: var(--bw-muted);
        font-size: 1rem;
      }

      #pinGateStatus,
      #status {
        margin-top: 12px;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <div class="options-shell">
      <h1>Shrimpt — Settings</h1>

      <div id="pin-gate" class="pin-gate" hidden>
        <h2 id="pin-gate-title">Unlock</h2>
        <p id="pin-gate-desc">A strong secret protects your keys for this browser session.</p>
        <div id="pin-create-fields">
          <label class="label" for="pinCreatePin">Secret</label>
          <input id="pinCreatePin" class="input" type="password" minlength="12" maxlength="256" autocomplete="new-password" />
          <label class="label" for="pinCreateConfirm">Confirm secret</label>
          <input id="pinCreateConfirm" class="input" type="password" minlength="12" maxlength="256" autocomplete="new-password" />
          <button type="button" id="pinCreateBtn" class="btn btn-primary">Save secret</button>
        </div>
        <div id="pin-unlock-fields" hidden>
          <label class="label" for="pinUnlockInput">Secret</label>
          <input id="pinUnlockInput" class="input" type="password" maxlength="256" autocomplete="current-password" />
          <button type="button" id="pinUnlockBtn" class="btn btn-primary" disabled>Unlock</button>
        </div>
        <p id="pinGateStatus" class="status" role="status" aria-live="polite"></p>
      </div>

      <main id="main-options" hidden>
        <p class="help">Changes save automatically. Use the toolbar popup for Send, Decrypt, and People.</p>

        <div class="options-card section-card">
          <label class="label" for="themeSelect">Appearance</label>
          <select id="themeSelect" class="input">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>

          <label class="check-row">
            <input id="autoDecrypt" type="checkbox" />
            <span>Auto-decrypt on pages</span>
          </label>

          <label class="label" for="observerDebounceMs">Scan debounce (ms)</label>
          <input id="observerDebounceMs" class="input" type="number" min="50" step="50" />
          <p class="help">Lower = more responsive on dynamic pages; higher = less CPU use.</p>
        </div>

        <div id="status" class="status" role="status" aria-live="polite"></div>
      </main>
    </div>

    <script type="module" src="./options.js"></script>
  </body>
</html>
